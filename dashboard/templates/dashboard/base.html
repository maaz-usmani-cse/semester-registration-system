<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; background-color: #f8f9fa; }
        .wrapper { display: flex; flex: 1; }
        aside { width: 230px; background-color: #ffffff; border-right: 1px solid #dee2e6; }
        main { flex: 1; background-color: #dbebe0; padding: 2.5rem; }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar bg-white border-bottom px-4">
        <span class="navbar-brand text-dark m-0 fw-bold">
            Welcome {{ user.username }}
        </span>
        <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm fw-semibold">Logout</a>
    </nav>

    <!-- Main Container -->
    <div class="wrapper">
        <!-- Sidebar Aside -->
        <aside class="p-3">
            <a href="{% url 'fill_exam_form' %}" class="btn btn-light border text-start w-100 mb-2 fw-semibold">
                Fill Exam Form
            </a>
            <a href="{% url 'show_details' %}" class="btn btn-light border text-start w-100 mb-2 fw-semibold">
                Show Form Details
            </a>
        </aside>

        <!-- Dynamic Content Canvas -->
        <main class="d-flex flex-column align-items-center">

            <!-- Django Messages Framework Alert Banner -->
            {% if messages %}
                <div class="w-100 mb-3" style="max-width: 600px;">
                    {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show text-center" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <!-- Dynamic Block Injection -->
            {% block content %}{% endblock %}

        </main>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-top text-center py-2 text-muted small">
        &copy; 2026 Student Portal. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
