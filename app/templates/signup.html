<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Elite Account</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Premium Fonts (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        /* Core System Reset & Global Aesthetic */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%);
            min-height: 100vh;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        /* Glassmorphism Premium Card */
        .signup-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Gradient Heading Look */
        .form-heading {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 100%);
    -webkit-background-clip: text;
    background-clip: text; /* <--- YE STANDARD LINE ADD KAR DO BHAI */
    -webkit-text-fill-color: transparent;
}

        /* Input Customizations (Matching your exact CSS logic) */
        .input-group-custom {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 16px;
            transition: color 0.3s ease;
            z-index: 10;
        }

        .form-control {
            background-color: rgba(30, 41, 59, 0.5) !important;
            border: 1px solid rgba(100, 116, 139, 0.3) !important;
            color: #f1f5f9 !important;
            padding: 12px 16px 12px 46px !important;
            font-size: 14.5px;
            border-radius: 10px !important;
            transition: all 0.3s ease !important;
        }

        .form-control::placeholder {
            color: #475569 !important;
        }

        /* Dynamic Glow on Focus */
        .form-control:focus {
            border-color: #c084fc !important;
            background-color: rgba(15, 23, 42, 0.9) !important;
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.25) !important;
        }

        .form-control:focus ~ .input-icon {
            color: #c084fc;
        }

        /* File Custom Input Field (Your exact specifications) */
        .form-control[type="file"] {
            padding: 8px 12px 8px 46px !important;
            cursor: pointer;
            color: #cbd5e1 !important; 
        }

        .form-control[type="file"]::file-selector-button {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%) !important;
            border: none !important;
            color: #ffffff !important;
            font-weight: 600 !important;
            padding: 6px 14px !important;
            border-radius: 6px !important;
            margin-right: 12px !important;
            transition: all 0.3s ease !important;
            cursor: pointer;
            font-size: 12.5px;
        }

        .form-control[type="file"]::file-selector-button:hover {
            background: linear-gradient(135deg, #b55fe6 0%, #4f46e5 100%) !important;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5) !important;
        }

        /* Styled Checkbox */
        .form-check-input {
            background-color: rgba(30, 41, 59, 0.5) !important;
            border: 1px solid rgba(168, 85, 247, 0.4) !important;
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: #a855f7 !important;
            border-color: #a855f7 !important;
        }

        /* Premium Submit Button with Shadow Glow */
        .submit-btn {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            padding: 13px;
            border-radius: 10px;
            width: 100%;
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.25);
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #b55fe6 0%, #4f46e5 100%);
            box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4);
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        /* Clean Accent Text Color */
        .text-purple-link {
            color: #a855f7;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .text-purple-link:hover {
            color: #c084fc;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="signup-card">
        
        <!-- Header Section -->
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px; background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%); border-radius: 14px; box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3);">
                <i class="bi bi-person-plus-fill text-white fs-4"></i>
            </div>
            <h1 class="form-heading mb-1">Create Account</h1>
            <p style="color: #94a3b8; font-size: 14px;">Fill in your details to get started with our premium platform.</p>
        </div>


        <!-- Error Message Display Context -->
{% if error %}
    <div class="alert error-alert" style="color: #ff3333; background: #ffe6e6; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center;">
        {{ error }}
    </div>
{% endif %}

<!-- Success Message Display Context -->
{% if success %}
    <div class="alert success-alert" style="color: #00aa00; background: #e6ffe6; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center;">
        {{ success }}
    </div>
{% endif %}
        <!-- Form Layout (Django Compatiable Elements) -->
        <form method="POST" action="" enctype="multipart/form-data" autocomplete="off" novalidate>
            {% csrf_token %}
            
            <!-- Full Name (Single Column - High Priority) -->
            <div class="mb-3">
                <label class="form-label small fw-medium text-slate-300" style="color: #cbd5e1;">Full Name</label>
                <div class="input-group-custom">
                    <input type="text" class="form-control" name="full_name" placeholder="John Doe" required>
                    <i class="bi bi-person input-icon"></i>
                </div>
            </div>

            <!-- Row 1: Username & Email Address (Side by Side) -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-medium" style="color: #cbd5e1;">Username</label>
                    <div class="input-group-custom">
                        <input type="text" class="form-control" name="username" placeholder="johndoe_dev" required>
                        <i class="bi bi-at input-icon"></i>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-medium" style="color: #cbd5e1;">Email Address</label>
                    <div class="input-group-custom">
                        <input type="email" class="form-control" name="email" placeholder="name@example.com" required>
                        <i class="bi bi-envelope input-icon"></i>
                    </div>
                </div>
            </div>

            <!-- Row 2: Mobile Number & Profile Picture (Side by Side) -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-medium" style="color: #cbd5e1;">Mobile Number</label>
                    <div class="input-group-custom">
                        <input type="tel" class="form-control" name="mobile" placeholder="+91 98765 43210" required>
                        <i class="bi bi-phone input-icon"></i>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-medium" style="color: #cbd5e1;">Profile Picture</label>
                    <div class="input-group-custom">
                        <input type="file" class="form-control" name="profile_pic" accept="image/*">
                        <i class="bi bi-image input-icon"></i>
                    </div>
                </div>
            </div>

            <!-- Row 3: Password & Confirm Password (Side by Side) -->
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label small fw-medium" style="color: #cbd5e1;">Password</label>
                    <div class="input-group-custom">
                        <input type="password" class="form-control" name="password" placeholder="••••••••" required>
                        <i class="bi bi-lock input-icon"></i>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-medium" style="color: #cbd5e1;">Confirm Password</label>
                    <div class="input-group-custom">
                        <input type="password" class="form-control" name="confirm_password" placeholder="••••••••" required>
                        <i class="bi bi-shield-check input-icon"></i>
                    </div>
                </div>
            </div>

           <div class="form-check mb-4 mt-2">
    <!-- FIXED: name="terms" add kiya hai backend mapping ke liye -->
    <input class="form-check-input" type="checkbox" name="terms" id="termsCheck">
    <label class="form-check-label small ms-1" for="termsCheck" style="color: #94a3b8;">
        I agree to the <a href="{% url 'legal_policy' %}" class="text-purple-link fw-semibold">Terms of Service</a> and <a href="{% url 'legal_policy' %}" class="text-purple-link fw-semibold">Privacy Policy</a>.
    </label>
</div>

            <!-- Main CTA Submit Button -->
            <button type="submit" class="submit-btn">
                Create Account
            </button>

            <!-- Industry Standard Footer Link to Login -->
            <div class="text-center mt-4 style-footer" style="color: #94a3b8; font-size: 14px;">
                Already have an account? 
                <a href="{% url 'login' %}" class="text-purple-link ms-1 fw-semibold">Log in</a>
            </div>

        </form>
    </div>

    <!-- Bootstrap 5 JavaScript Bundle Component -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
